<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Desafio</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================================
         JOGO
    ================================================== -->

    <main id="jogo">


        <!-- ÁREA DO ENIGMA -->

        <section class="enigma">


            <!-- TÍTULO -->

            <h1 id="titulo">
                Carregando...
            </h1>


            <!-- IMAGEM -->

            <div id="imagem"></div>


            <!-- TEXTO -->

            <p id="texto">
                Carregando...
            </p>


        </section>



        <!-- =================================================
             ÁREA DA RESPOSTA
        ================================================== -->

        <div class="area-resposta">


            <input
                type="text"
                id="resposta"
                placeholder="Digite sua resposta..."
                autocomplete="off"
            >


            <button
                id="botao-resposta"
                onclick="verificarResposta()"
            >
                ↵
            </button>


        </div>


    </main>



    <!-- =================================================
         TELA FINAL
    ================================================== -->

    <section id="final">


        <div class="final-conteudo">


            <h1>
                Você conseguiu.
            </h1>


            <p>
                Todos os enigmas foram resolvidos.
            </p>


        </div>


    </section>



    <script src="script.js"></script>


</body>

</html>
